name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Secret scanning — CodeQL (.github/workflows/codeql.yml) covers SAST but explicitly does not
    # detect leaked credentials, so this closes that separate gap. Runs the gitleaks CLI directly
    # (MIT-licensed, github.com/gitleaks/gitleaks) rather than the gitleaks/gitleaks-action wrapper
    # -- that wrapper's license changed to a commercial EULA at v2.0.0 (free for personal accounts,
    # but still a vendor dependency this phase's non-goals rule out); the underlying CLI has no
    # such restriction.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks

      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact --exit-code 1 --report-format sarif --report-path gitleaks-report.sarif

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest tests/ -v --cov=core --cov=services --cov=pipeline --cov-report=term-missing

  frontend-test:
    # WP-30.1 (Phase 30) -- first standalone frontend CI job; previously only the `docker` job
    # built frontend/dist as part of the image, which proves the build succeeds but runs no tests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test

  docker:
    # Docker smoke test for the image/compose files added in WP-25.3 (Phase 25). GitHub-hosted
    # runners have unprivileged Docker support built in already — no nested-container/DinD
    # problem here, unlike a Docker-in-Docker dev sandbox. There's no real Ollama in CI, so this
    # only proves the container builds, starts, and honors REQBOT_QDRANT_URL/REQBOT_OLLAMA_URL —
    # not full ask/search behavior, which needs real models and is out of scope for CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start stack
        run: |
          # documents/processed/ is gitignored (real user data) — the bind mount in
          # docker-compose.example.yml expects it to exist, same as it would on a real
          # deployment after a first `reqbot ingest`.
          mkdir -p documents/processed
          docker compose -f docker-compose.example.yml up -d --build

      - name: Wait for reqbot to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/status >/dev/null; then
              echo "reqbot responded after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "reqbot never responded on /api/status" >&2
          docker compose -f docker-compose.example.yml logs
          exit 1

      - name: Verify Qdrant/Ollama URLs are honored from inside the container
        run: |
          resp="$(curl -sf http://127.0.0.1:8000/api/status)"
          echo "$resp"
          echo "$resp" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          qdrant_url = d["qdrant_url"]
          assert qdrant_url == "http://qdrant:6333", "unexpected qdrant_url: " + qdrant_url
          assert d["qdrant"]["reachable"] is True, "qdrant not reachable from inside the container"
          assert d["ollama_url"], "ollama_url missing from status response"
          '

      - name: Verify the packaged frontend/dist is served
        run: curl -sf http://127.0.0.1:8000/ | grep -qi '<div id="root"'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.example.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.example.yml down -v
