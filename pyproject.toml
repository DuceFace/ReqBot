[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqbot"
version = "0.1.0"
description = "Local-AI compliance requirements extraction, indexing, and search"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "docling==2.84.0",
    "fastembed==0.7.4",
    "qdrant-client==1.17.0",
    "ollama==0.6.1",
    "requests==2.33.0",
    "openpyxl==3.1.5",
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "aiofiles==25.1.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
# docling used to be gated out of base purely for weight (torch/torchvision) --
# see archive/PHASE25_REQUIREMENTS.md. Moved into base as of WP-34.1: it's now
# the only ingestion path (legacy pymupdf/pdfplumber chunking was removed), so
# making it optional would mean a default install can't ingest anything at all.
# See docs/PHASE34_REQUIREMENTS.md.
# remote and mcp stay gated because they're optional *integration surfaces*
# (cloud LLM synthesis; external MCP clients) that a CLI/GUI-only install doesn't
# need, regardless of how light their own dependencies are.
remote = ["anthropic>=0.40.0", "openai>=1.50.0"]
mcp = ["mcp>=1.0.0"]  # WP-26.1-approved: official Python MCP SDK (mcp.server.fastmcp)
# WP-35.4: Step D.6's description-grounding entailment check (pipeline/entailment_gate.py).
# Gated out of base -- its GitHub install pulls torch/transformers/datasets/openai/pyarrow,
# a heavy footprint not needed for basic ingestion (docs/PHASE35_REQUIREMENTS.md §3
# Non-Goals). Pinned to the exact commit this repo's threshold (WP-35.2) was calibrated
# against, matching this project's general dependency-pinning discipline.
#
# `pip install minicheck` installs an unrelated PyPI package that happens to squat this
# name (a formal state-machine model checker, nothing to do with NLI/fact-checking) --
# the real MiniCheck (Liyan06/MiniCheck, Bespoke Labs/UPenn) only installs from GitHub,
# hence the git URL below rather than a plain "minicheck" spec (docs/PHASE34_REQUIREMENTS.md).
# Also needs one NLTK resource this extra can't install on its own: run
# `python3 -c "import nltk; nltk.download('punkt_tab')"` after installing.
grounding-check = [
    "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@b58b9fa69acbd1015ec970fa65dd752413a053d2",
]
dev = ["pytest==9.1.1", "ruff==0.15.22", "pytest-cov==7.1.0"]

[project.scripts]
reqbot = "cli.reqbot:main"

[tool.setuptools]
packages = [
    "api",
    "api.routes",
    "cli",
    "core",
    "frontend",
    "mcp_server",
    "models",
    "pipeline",
    "services",
    "profiles",
]
# MANIFEST.in is the source of truth for which non-.py files get included (a plain
# package-data glob doesn't reliably handle frontend/dist/'s dynamically-hashed,
# deeply nested Vite output across setuptools versions — recursive-include does).
include-package-data = true

[tool.setuptools.exclude-package-data]
# test-*.json fixtures are for tests/unit/, not something the installed package ships.
profiles = ["test-*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    "archive",
    "Backups",
    "dist",
    "build",
    "__pycache__",
]

[tool.ruff.lint]
# E4: import errors  E7: statement errors  E9: runtime errors  F: pyflakes  I: isort
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# E402/I001: sys.path injection before imports is used throughout the codebase to
# support both package import and direct-script invocation. Permanent fix is
# `pip install -e .` — tracked as Phase 19.5 packaging tech debt.
# F401/F541: baseline suppression; these are real findings but not correctness blockers.
# Fix in a dedicated cleanup PR, not in WP-19.5.1.
"api/*.py"             = ["E402"]
"cli/*.py"             = ["E402", "F401", "F541", "I001"]
"core/*.py"            = ["E402", "I001"]
"pipeline/*.py"        = ["E402", "F541", "I001"]
"services/*.py"        = ["E402"]
"eval/*.py"            = ["E402", "E741", "F401", "F541", "F841", "I001"]
"record_baseline_dirs.py" = ["F401"]
